services:
  opcbrain:
    build: .
    image: opcbrain:latest
    container_name: opc-brain
    # Use host networking so the container can reach host-local services (e.g.
    # vLLM on localhost:9096) and shares the same network namespace as a native
    # deployment. This keeps one opcbrain.yaml working for both Docker and local.
    network_mode: host
    volumes:
      # Use the host's .opcbrain directory so Docker and local deployments share
      # the same generated config, auth DB, sessions/projects, memory, etc.
      - ${HOME}/.opcbrain:/root/.opcbrain
      # Optional: mount an existing config file instead of generating one from env vars.
      # Create the host file first, then uncomment this line.
      # - ${OPCBRAIN_CONFIG:-${HOME}/.opcbrain/opcbrain.yaml}:/root/.opcbrain/opcbrain.yaml:ro
      # Expose a host workspace to agents running inside the container.
      - ${OPCBRAIN_WORKSPACE:-./workspace}:/workspace
    environment:
      NODE_ENV: production
      OPCBRAIN_HOME: /root/.opcbrain
      DATABASE_PATH: /root/.opcbrain/auth.db
      HOST: 0.0.0.0
      SERVER_PORT: "3001"
      OPCBRAIN_GATEWAY_PORT: "18789"
      OPCBRAIN_GATEWAY_URL: ws://127.0.0.1:18789/ws
      OPCBRAIN_SKIP_BROWSER_OPEN: "1"
      OPCBRAIN_WORKSPACE_ROOT: /workspace
      OPCBRAIN_DISABLE_LOCAL_AUTH: ${OPCBRAIN_DISABLE_LOCAL_AUTH:-true}
      OPCBRAIN_MODEL: ${OPCBRAIN_MODEL:-openrouter/deepseek/deepseek-v4-flash}
      OPCBRAIN_LIGHT_MODEL: ${OPCBRAIN_LIGHT_MODEL:-openrouter/qwen/qwen3-8b}
      OPCBRAIN_API_KEY: ${OPCBRAIN_API_KEY:-PLACEHOLDER_RUN_ONBOARDING_TO_REPLACE}
      OPCBRAIN_API_URL: ${OPCBRAIN_API_URL:-https://openrouter.ai/api/v1}
      OPCBRAIN_LIGHT_API_KEY: ${OPCBRAIN_LIGHT_API_KEY:-}
      OPCBRAIN_LIGHT_API_URL: ${OPCBRAIN_LIGHT_API_URL:-}
      OPCBRAIN_PROXY: ${OPCBRAIN_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

